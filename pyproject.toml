[project]
name = "ledger-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kpranav", email = "kpranav@akamai.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "bcrypt<4.1",
    "fastapi[standard]>=0.141.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
ledger-api = "ledger_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
